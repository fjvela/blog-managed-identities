name: Destroy Terraform Infrastructure

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

env:
  TERRAFORM_DIR: './infra'

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
      GITHUB_ORGANIZATION_NAME: ${{ github.repository_owner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init
        env:
          TF_VAR_subscription_id: ${{ env.SUBSCRIPTION_ID }}
          TF_VAR_github_repository_name: ${{ env.GITHUB_REPOSITORY_NAME }}
          TF_VAR_github_organization_name: ${{ env.GITHUB_ORGANIZATION_NAME }}
          TF_VAR_github_token: ${{ secrets.GH_TOKEN_WRITE_SECRETS }}

      - name: Terraform Destroy
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform destroy -auto-approve
        env:
          TF_VAR_subscription_id: ${{ env.SUBSCRIPTION_ID }}
          TF_VAR_github_repository_name: ${{ env.GITHUB_REPOSITORY_NAME }}
          TF_VAR_github_organization_name: ${{ env.GITHUB_ORGANIZATION_NAME }}
          TF_VAR_github_token: ${{ secrets.GH_TOKEN_WRITE_SECRETS }}
